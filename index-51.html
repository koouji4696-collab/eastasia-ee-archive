<style>
/* Layout concept: 白に近い紙面と墨色の文字。ゴシック体だけで組み、装飾は東アジアの海岸線の地図に絞る。
   色分けは「国」にだけ与え、投稿の種類やテーマは文字と形で見分ける。 */
:root {
  --bg: #F6F7F5;
  --surface: #FFFFFF;
  --surface-2: #EEF1EE;
  --ink: #111715;
  --ink-2: #3D4843;
  --muted: #66726C;
  --line: #E2E6E3;
  --line-2: #CBD3CE;
  --brand: #111715;
  --brand-ink: #FFFFFF;
  --brand-hover: #2B3833;
  --signal: #C8442C;
  --focus: #2A78D6;
  --c-jp: #2a78d6;
  --c-cn: #eb6834;
  --c-kr: #1baf7a;
  --bar: #7E8F88;
  --bar-strong: #111715;
  --bar-issue: #C8442C;
  --track: #E6EAE7;
  --grid: #E2E6E3;
  --st-api: #DDF1DF;
  --st-local: #FBF0CC;
  --st-error: #FCE3D6;
  --st-snap: #DCEBF7;
  --st-pend: #F1E4F7;
  --good: #0a7a0a;
  --warn-ink: #7A4A00;
  --shadow: 0 1px 2px rgba(17, 23, 21, .05), 0 12px 32px rgba(17, 23, 21, .08);
  --font-sans: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "PingFang SC", "Microsoft YaHei", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-serif: var(--font-sans);
  --leaf: #3D4843;
  --seal: #C8442C;
  --foot-bg: #111715;
  --foot-ink: #A7B3AE;
  --hero-a: #EEF1EE;
  --sea: #E4ECE8;
  --land: #FFFFFF;
  --coast: #A6BAB2;
}
@media (prefers-color-scheme: dark) {

    --bg: #0C110F;

    --muted: #8B9792;
    --line: #222B28;

    --brand-ink: #0C110F;
    --brand-hover: #FFFFFF;
    --signal: #E8735C;
    --focus: #6DA7EC;
    --c-jp: #3987e5;
    --c-cn: #d95926;
    --c-kr: #199e70;
    --bar: #6B7D76;
    --bar-strong: #ECF1EE;
    --bar-issue: #E8735C;
    --track: #1B2320;
    --grid: #26302C;
    --st-api: #17301B;
    --st-local: #3A3012;
    --st-error: #3C2116;
    --st-snap: #14293A;
    --st-pend: #2C1D36;
    --good: #4cc44c;
    --warn-ink: #F2C46B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .35);
    color-scheme: dark;
  
    --leaf: #B6C1BC;
    --seal: #D0452F;
    --foot-bg: #070A09;
    --foot-ink: #93A09A;
    --hero-a: #141A18;
    --sea: #111916;
    --land: #1A2421;
    --coast: #41554D;
  }
}
:root[data-theme="dark"] {
  --bg: #0C110F;
  --surface: #141A18;

  --ink-2: #B6C1BC;

/* 言語ごとに字形の正しい書体を先頭に */
html[lang="zh-CN"] { --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans JP", system-ui, sans-serif; }
html[lang="ko"] { --font-sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans JP", system-ui, sans-serif; }
html[lang="en"] { --font-sans: "Noto Sans", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "Hiragino Sans", "Microsoft YaHei", "Malgun Gothic", sans-serif; }

* { box-sizing: border-box; }
html { scroll-padding-top: 96px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.8 var(--font-sans); letter-spacing: .01em; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 70; }
img, svg { max-width: 100%; }
a { color: inherit; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.35; text-wrap: balance; word-break: keep-all; word-break: auto-phrase; overflow-wrap: anywhere; }
.hero-copy, .q-text, .tl-place b { word-break: keep-all; word-break: auto-phrase; overflow-wrap: anywhere; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--brand); color: var(--brand-ink); padding: 8px 14px; z-index: 100; }
.skip:focus { left: 8px; top: 8px; }
.wrap { width: 100%; max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
[hidden] { display: none !important; }

/* ---------- 接続ステータス ---------- */
.statusbar { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; font-weight: 500; line-height: 1.5; color: var(--ink); background: var(--st-local); }
.statusbar[data-state="api"] { background: var(--st-api); }
.statusbar[data-state="error"] { background: var(--st-error); }
.statusbar[data-state="snapshot"] { background: var(--st-snap); }
.pendingbar { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; font-weight: 600; line-height: 1.5; color: var(--ink); background: var(--st-pend); }
.pendingbar[hidden] { display: none; }
.pendingbar span { text-decoration: underline; text-underline-offset: 3px; }
.statusbar:hover { filter: brightness(.97); }
.statusbar span { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }

/* ---------- ヘッダー ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 12px; padding-block: 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 15px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.langs { margin-left: auto; display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; flex: none; }
.langs button { border: 0; background: transparent; padding: 6px 11px; font-size: 13px; font-weight: 500; cursor: pointer; line-height: 1.4; }
.langs button + button { border-left: 1px solid var(--line-2); }
.langs button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 8px; }
.tabs a { flex: 0 1 auto; text-decoration: none; font-size: 13px; font-weight: 600; line-height: 1.45; padding: 6px 12px; border-radius: 8px; color: var(--ink-2); border: 1px solid var(--line-2); background: transparent; word-break: keep-all; overflow-wrap: anywhere; }
.tabs a:hover { border-color: var(--ink-2); color: var(--ink); }
.tabs a[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.tabpanel[hidden] { display: none; }
.tab-first { border-top: 0; padding-block: 34px 22px; }
.section, .tab-first { scroll-margin-top: 150px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pill { text-decoration: none; font-size: 13.5px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink); background: var(--surface); }
.pill:hover { border-color: var(--ink-2); }
.purpose-grid, .guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.purpose { display: grid; gap: 8px; align-content: start; }
.purpose h3, .guide-card h3 { font-size: 1.15rem; }
.purpose p, .guide-card p { font-size: 14.5px; line-height: 1.85; color: var(--ink-2); }
.purpose-no { font-size: 1.9rem; line-height: 1; color: var(--signal); }
.stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat-tile { display: grid; gap: 2px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.stat-tile b { font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-tile span { font-size: 13px; color: var(--ink-2); }
.guide-card { display: grid; gap: 8px; align-content: start; text-decoration: none; color: inherit; }
.guide-card:hover { box-shadow: var(--shadow); border-color: var(--line-2); }
.guide-card .btn { justify-self: start; }
.official-links { display: flex; flex-wrap: wrap; gap: 10px; }
.official-link { margin-top: 18px; }
.doc-group { margin-top: 30px; }
.doc-group:first-child { margin-top: 0; }
.doc-group-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.doc-group-head h3 { font-size: 1.15rem; }
.doc-group-head small { font-family: var(--font-sans); font-size: 13px; color: var(--muted); font-weight: 500; }
.tl-year.long { font-size: .95rem; }
.footer a { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- ボタン・チップ ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; line-height: 1.4; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ink-2); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; line-height: 1.4; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); }
.chip[data-c="JP"] i { background: var(--c-jp); }
.chip[data-c="CN"] i { background: var(--c-cn); }
.chip[data-c="KR"] i { background: var(--c-kr); }
.chip[data-c="ONLINE"] i { background: var(--ink-2); }
.tag { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.badge-pending { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 1px 8px; border-radius: 4px; background: var(--st-pend); color: var(--ink); border: 1px solid var(--line-2); }
.badge-sample { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 1px 8px; border-radius: 4px; border: 1px dashed var(--muted); color: var(--muted); }

/* ---------- ヒーロー ---------- */
.hero { padding-block: 44px 56px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 40px; align-items: center; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); line-height: 1.6; }
.hero h1 { font-size: clamp(1.8rem, 4.4vw, 3.1rem); line-height: 1.3; margin-top: 14px; letter-spacing: .01em; }
.hero-copy { margin-top: 20px; font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.8; padding-left: 16px; border-left: 3px solid var(--signal); color: var(--ink); max-width: 36em; }
.task { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; max-width: 40em; }
.task-label { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--brand-ink); background: var(--brand); padding: 1px 10px; border-radius: 3px; margin-bottom: 6px; }
.task p { font-size: 15px; line-height: 1.8; }
.hero-cta { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; }
.hero-meta { margin: 28px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 24px; max-width: 46em; }
.hero-meta div { border-top: 1px solid var(--line-2); padding-top: 8px; min-width: 0; }
.hero-meta dt { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
.hero-meta dd { margin: 2px 0 0; font-size: 14px; line-height: 1.6; }
.hero-art { width: 100%; max-width: 280px; justify-self: center; }
.hero-art svg { display: block; width: 100%; height: auto; }

/* ---------- セクション ---------- */
.section { padding-block: 60px; border-top: 1px solid var(--line); }
.section-head { max-width: 46em; margin-bottom: 30px; display: grid; gap: 10px; }
.section-head h2 { font-size: clamp(1.45rem, 3vw, 2.05rem); }
.lead { color: var(--ink-2); font-size: 15.5px; line-height: 1.85; }
.sub-head { font-size: clamp(1.15rem, 2.2vw, 1.4rem); margin: 44px 0 6px; }
.sub-lead { color: var(--ink-2); font-size: 14.5px; margin-bottom: 18px; max-width: 46em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }

/* 三つのレンズ */
.lens-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.lens { display: flex; flex-direction: column; gap: 12px; }
.lens-top { display: flex; align-items: baseline; gap: 10px; }
.lens-no { font-size: 1.7rem; line-height: 1; color: var(--signal); }
.lens-name { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.lens h3 { font-size: 1.12rem; }
.lens p { font-size: 14.5px; color: var(--ink-2); line-height: 1.85; }
.figs { margin: auto 0 0; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 22px; }
.fig { min-width: 0; }
.fig b { display: block; font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
.fig span { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; }

.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.field h4 { font-size: 1.1rem; margin: 6px 0 6px; }
.field .tag { display: inline-block; }
.field > p { font-size: 14.5px; color: var(--ink-2); }
.points { margin-top: 12px; display: grid; gap: 8px; }
.points li { position: relative; padding-left: 18px; font-size: 14.5px; line-height: 1.75; }
.points li::before { content: ""; position: absolute; left: 2px; top: .8em; width: 7px; height: 7px; border-radius: 50%; background: var(--signal); }

.q-list { display: grid; gap: 12px; counter-reset: q; }
.q { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.q-no { font-size: 1.7rem; line-height: 1; color: var(--signal); }
.q-text { font-size: clamp(1rem, 1.8vw, 1.2rem); line-height: 1.7; }

/* ---------- 絞り込み・添付 ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; margin-bottom: 18px; }
.field-sel { display: grid; gap: 3px; min-width: 0; }
.field-sel span { font-size: 12px; font-weight: 600; color: var(--muted); }
.sel, .inp, .txt { width: 100%; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); padding: 8px 10px; font-size: 14.5px; line-height: 1.5; color: var(--ink); }
.sel { padding-right: 28px; }
.toolbar .spacer { flex: 1 1 auto; }
.privacy { font-size: 13px; color: var(--muted); margin-bottom: 18px; max-width: 52em; }
.attach { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); }
.thumb { width: 88px; height: 64px; border-radius: 5px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attach-info { display: grid; gap: 4px; min-width: 0; justify-items: start; font-size: 13px; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 10px; font-size: 14.5px; grid-column: 1 / -1; }

/* ---------- ダッシュボード ---------- */
.stat-line { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.stat-n b { font-size: 2.6rem; line-height: 1; font-weight: 700; margin-right: 6px; }
.stat-n span { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat-split { display: flex; flex-wrap: wrap; gap: 8px; }
.chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.chart-card { display: grid; gap: 14px; }
.chart-card.wide { grid-column: 1 / -1; }
.chart-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.chart-head h3 { font-size: 1rem; line-height: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.bars { display: grid; gap: 12px; position: relative; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label val" "track track"; gap: 4px 12px; align-items: baseline; font-size: 13.5px; line-height: 1.5; }
.bar-label { grid-area: label; min-width: 0; color: var(--ink); }
.bar-label small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
.bar-val { grid-area: val; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-val small { color: var(--muted); font-weight: 500; }
.bar-track { grid-area: track; position: relative; height: 22px; background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px); background-size: 20% 100%; border-left: 1px solid var(--line-2); border-right: 1px solid var(--grid); }
.bar { position: absolute; left: 0; top: 3px; bottom: 3px; max-width: 100%; border-radius: 0 4px 4px 0; background: var(--bar); min-width: 2px; cursor: default; transition: filter .12s; }
.bar:hover, .bar:focus-visible { filter: brightness(1.12); }
.bar[data-k="top"] { background: var(--bar-strong); }
.bar[data-k="issue"] { background: var(--bar-issue); }
.bar[data-c="JP"] { background: var(--c-jp); }
.bar[data-c="CN"] { background: var(--c-cn); }
.bar[data-c="KR"] { background: var(--c-kr); }
.axis { position: relative; height: 16px; margin-top: 2px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }
.chart-note { font-size: 13px; color: var(--ink-2); line-height: 1.75; }
.view-toggle { font-size: 12.5px; border: 1px solid var(--line-2); background: transparent; border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; color: var(--ink-2); }
.view-toggle:hover { border-color: var(--ink-2); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.7; }
th { font-size: 12.5px; color: var(--muted); font-weight: 700; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.insights { margin-top: 18px; display: grid; gap: 10px; }
.insights li { position: relative; padding-left: 18px; font-size: 14.5px; line-height: 1.8; }
.insights li::before { content: ""; position: absolute; left: 2px; top: .8em; width: 7px; height: 7px; border-radius: 50%; background: var(--signal); }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.5; padding: 6px 10px; border-radius: 6px; max-width: 260px; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }

/* ---------- 年表 ---------- */
.admin-note { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.timeline { position: relative; display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 0 18px; position: relative; }
.tl-rail { position: relative; text-align: right; padding: 16px 18px 16px 0; }
.tl-rail::after { content: ""; position: absolute; right: -1px; top: 0; bottom: 0; width: 2px; background: var(--line-2); }
.tl:first-child .tl-rail::after { top: 24px; }
.tl:last-child .tl-rail::after { bottom: calc(100% - 24px); }
.tl-year { font-size: 1.15rem; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.tl-year.unknown { color: var(--muted); font-weight: 500; font-size: .9rem; }
.tl-nth { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.tl-dot { position: absolute; right: -6px; top: 20px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-2); z-index: 1; }
.tl.known .tl-dot { background: var(--signal); border-color: var(--signal); }
.tl-body { padding: 8px 0 10px; min-width: 0; }
.tl-card { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.tl.known .tl-card { border-color: var(--line-2); }
.tl-place { flex: 1 1 220px; min-width: 0; }
.tl-place b { display: block; font-size: 15px; line-height: 1.5; }
.tl-place b.unknown { color: var(--muted); font-weight: 500; font-size: 14px; }
.tl-place small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.tl-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- アーカイブ ---------- */
.archive-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.arc { display: grid; gap: 10px; align-content: start; }
.arc-thumb { aspect-ratio: 16 / 10; width: 100%; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.arc-thumb img { width: 100%; height: 100%; object-fit: cover; }
.arc-thumb.noimg { aspect-ratio: auto; height: 44px; font-size: 11px; }
.arc h3 { font-size: .98rem; line-height: 1.55; }
.arc-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.arc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.drive-root { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.hint { font-size: 13px; color: var(--muted); }
.embed-frame { width: 100%; height: 440px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); margin-bottom: 16px; }

/* ---------- メンバー ---------- */
.member-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.member-col h3 { display: flex; align-items: center; gap: 8px; font-size: 1.02rem; margin-bottom: 8px; }
.member-col h3 i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.mem { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 1px; }
.mem small { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.mem b { font-size: 14.5px; font-weight: 600; }
.mem b.unreg { color: var(--muted); font-weight: 400; font-size: 13.5px; }

/* ---------- フッター ---------- */
.footer { border-top: 1px solid var(--line); padding-block: 36px 56px; font-size: 13px; color: var(--muted); }
.footer p + p { margin-top: 6px; }

/* ---------- モーダル ---------- */
.overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(8, 16, 20, .55); overflow-y: auto; }
.modal { width: 100%; max-width: 640px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 16px; }
.modal.wide { max-width: 860px; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.modal-head h2 { font-size: 1.25rem; }
.x { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 4px 8px; cursor: pointer; color: var(--ink-2); border-radius: 6px; }
.x:hover { background: var(--surface-2); }
.form { display: grid; gap: 14px; }
.form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.lab { display: grid; gap: 4px; min-width: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.lab em { font-style: normal; color: var(--signal); font-weight: 700; margin-left: 4px; font-size: 12px; }
.lab small { font-weight: 400; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
.txt { min-height: 130px; resize: vertical; line-height: 1.7; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; cursor: pointer; background: var(--surface); }
.checks input { accent-color: var(--brand); }
.checks label:has(input:checked) { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.msg { white-space: pre-line; font-size: 13.5px; line-height: 1.7; padding: 8px 12px; border-radius: 6px; background: var(--surface-2); }
.msg[data-k="ok"] { background: var(--st-api); }
.msg[data-k="ng"] { background: var(--st-error); }
.drive-prev { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 13px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.guide { display: grid; gap: 6px; padding-left: 0; counter-reset: s; }
.guide li { counter-increment: s; position: relative; padding-left: 30px; font-size: 14px; line-height: 1.75; }
.guide li::before { content: counter(s); position: absolute; left: 0; top: .25em; width: 21px; height: 21px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.reach { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.reach li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13.5px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
.reach .rs[data-r="ok"] { color: var(--good); font-weight: 700; }
.reach .rs[data-r="ng"] { color: var(--bar-issue); font-weight: 700; }
.reach .rs[data-r="na"], .reach .rs[data-r="wait"] { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; word-break: break-all; }
h3.sub { font-size: 1rem; margin: 18px 0 6px; }
.mirrors { font-size: 13px; }
.mirrors a { text-decoration: underline; text-underline-offset: 3px; }
.mirrors[hidden] { display: none; }
details.fold > summary { cursor: pointer; font-weight: 700; font-size: 14.5px; padding: 6px 0; }
.preview-frame { width: 100%; height: min(60vh, 520px); border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); }
.item-list { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.item b { font-size: 14.5px; line-height: 1.5; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); z-index: 95; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-size: 14px; line-height: 1.6; max-width: min(92vw, 520px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: var(--shadow); }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- レスポンシブ ---------- */
@media (max-width: 960px) {
  .archive-grid, .member-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lens-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .hero-art { max-width: 150px; order: -1; justify-self: start; }
  .field-grid, .chart-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .tabs a { flex: 0 0 auto; white-space: nowrap; max-width: 78vw; overflow: hidden; text-overflow: ellipsis; }
  .section, .tab-first { scroll-margin-top: 120px; }
  .tab-first { padding-block: 24px 16px; }
  body { font-size: 15.5px; }
  .section { padding-block: 44px; }
  .brand-text { display: none; }
  .archive-grid, .member-grid, .form-row { grid-template-columns: 1fr; }
  .tl { grid-template-columns: 76px minmax(0, 1fr); gap: 0 14px; }
  .tl-rail { padding-right: 14px; }
  .q { grid-template-columns: auto minmax(0, 1fr); }
  .q .btn { grid-column: 1 / -1; justify-self: start; }
  .modal { padding: 16px; }
  .attach, .drive-prev { grid-template-columns: 72px minmax(0, 1fr); }
  .thumb { width: 72px; height: 54px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}
@media (forced-colors: active) {
  .bar { forced-color-adjust: none; border: 1px solid CanvasText; }
}

/* =====================================================================
   シンプルなデザイン（東アジアの地図をベースに）
   文字はすべてゴシック。色は墨色の濃淡が基本で、国の色（藍＝日本、朱＝中国、青磁＝韓国）は
   地図の点と小さな印にだけ使う。地図は海岸線だけ（国境線と海の名称は描かない）。
   ===================================================================== */
::selection { background: color-mix(in srgb, var(--c-jp) 22%, transparent); }
.ico { flex: none; }
body { font-size: 15.5px; line-height: 1.85; letter-spacing: .01em; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, .brand, .tabs a, .btn, .eyebrow { font-feature-settings: "palt" 1; }
h1, h2 { letter-spacing: .02em; }

/* 地図の部品（symbol#eaMap）：色は呼び出し側のカスタムプロパティで決める */
.ea-land { fill: var(--map-land-fill, none); stroke: var(--map-land-stroke, none); stroke-width: var(--map-land-sw, 1.1); stroke-linejoin: round; }
.ea-grat { fill: none; stroke: var(--map-grat, none); stroke-width: 1; }

/* ヘッダー */
.topbar { background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--line); }
.topbar-in { padding-block: 12px 6px; }
.brand { gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: .03em; }
.brand-mark { width: 32px; height: 32px; }
.bm-ring { fill: var(--sea); stroke: var(--line-2); stroke-width: 1; }
.bm-map { --map-land-fill: var(--land); --map-land-stroke: var(--coast); --map-land-sw: 5; --map-grat: none; }
.bm-sea { fill: var(--sea); }
.langs { border-radius: 999px; border-color: var(--line-2); }
.langs button { padding: 5px 12px; font-size: 12.5px; color: var(--ink-2); }
.langs button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.tabs { gap: 0 20px; padding-bottom: 0; }
.tabs a { position: relative; border: 0; background: none; border-radius: 0; padding: 10px 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tabs a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; border-radius: 2px; }
.tabs a:hover { color: var(--ink); background: none; }
.tabs a[aria-selected="true"] { color: var(--ink); background: none; }
.tabs a[aria-selected="true"]::after { background: var(--ink); }

/* ボタン・印 */
.btn { border-radius: 999px; padding: 10px 20px; font-weight: 600; border-color: var(--line-2); }
.btn-sm { padding: 6px 14px; }
.btn:hover { border-color: var(--ink); }
.btn-primary:hover { border-color: var(--brand-hover); }
.chip { border: 0; background: transparent; padding: 0; gap: 5px; color: var(--ink-2); font-weight: 600; }
.chip i { width: 8px; height: 8px; }
.tag { border-radius: 999px; padding: 1px 9px; background: var(--surface-2); }
.pill { background: transparent; border-color: var(--line-2); font-weight: 600; color: var(--ink-2); }
.pill:hover { color: var(--ink); border-color: var(--ink); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lab em { color: var(--signal); }

/* ヒーロー：右側いっぱいの東アジア地図 */
.hero, .tab-first { position: relative; overflow: hidden; isolation: isolate; }
.hero { padding-block: 84px 96px; background: var(--bg); }
.hero > .wrap, .tab-first > .wrap { position: relative; z-index: 1; }
.hero-map { position: absolute; z-index: 0; top: 0; bottom: 0; right: 0; width: min(62%, 860px); background: var(--sea); -webkit-mask-image: linear-gradient(90deg, transparent 0, transparent 12%, #000 48%); mask-image: linear-gradient(90deg, transparent 0, transparent 12%, #000 48%); pointer-events: none; }
.hero-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; --map-land-fill: var(--land); --map-land-stroke: var(--coast); --map-grat: color-mix(in srgb, var(--coast) 22%, transparent); }
.hd { stroke: var(--land); stroke-width: 3.5; fill: var(--ink-2); }
.hd[data-c="JP"] { fill: var(--c-jp); }
.hd[data-c="CN"] { fill: var(--c-cn); }
.hd[data-c="KR"] { fill: var(--c-kr); }
.hd.now { stroke-width: 5; }
.hd-pulse { fill: none; stroke: var(--c-jp); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: ep-pulse 2.6s ease-out 1.2s 3 both; }
@keyframes ep-pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(3.6); opacity: 0; } }
.hd-label { font: 700 22px var(--font-sans); fill: var(--ink); text-anchor: end; paint-order: stroke; stroke: var(--sea); stroke-width: 7px; stroke-linejoin: round; letter-spacing: .04em; }
.hero-grid { display: block; }
.hero-main { max-width: 40rem; }
.hero h1 { font-size: clamp(1.9rem, 4.4vw, 3rem); line-height: 1.22; font-weight: 700; margin-top: 18px; max-width: 13em; }
.hero-copy { font-family: inherit; border-left: 0; padding-left: 0; margin-top: 22px; font-size: clamp(1rem, 1.6vw, 1.12rem); line-height: 1.9; color: var(--ink-2); max-width: 30em; }
.hero-cta { margin-top: 30px; }
.hero-meta { margin-top: 40px; }
.hero-meta div { border-top-color: var(--line-2); }
.hero-meta dt { letter-spacing: .12em; }

/* 各タブの頭と巻末：薄い海岸線 */
.bg-map { position: absolute; z-index: 0; right: -140px; top: -70px; width: 760px; height: auto; aspect-ratio: 1000 / 825; pointer-events: none; opacity: .7; --map-land-fill: none; --map-land-stroke: color-mix(in srgb, var(--coast) 55%, transparent); --map-grat: none; }
.foot-map { right: -60px; top: auto; bottom: -230px; width: 640px; opacity: .5; --map-land-stroke: color-mix(in srgb, var(--foot-ink) 30%, transparent); --map-grat: none; }

/* セクション */
.section { padding-block: 76px; border-top: 1px solid var(--line); }
.tab-first { padding-block: 56px 40px; border-top: 0; }
.section-head { gap: 12px; margin-bottom: 34px; }
.section-head h2 { font-size: clamp(1.5rem, 2.8vw, 2.05rem); line-height: 1.3; }
.tab-first .section-head h2 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); }
.sub-head { font-size: clamp(1.1rem, 2vw, 1.3rem); }
.card, .q, .tl-card, .type-card, .post, .stat-tile { border-radius: 16px; }
.card { border-color: var(--line); box-shadow: none; padding: 22px; }
.guide-card { transition: border-color .15s; }
.guide-card:hover { box-shadow: none; border-color: var(--ink); }
.purpose-no, .lens-no, .q-no { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .1em; font-variant-numeric: tabular-nums; line-height: 1.4; }
.purpose h3, .guide-card h3, .lens h3 { font-size: 1.1rem; }
.lens-name { letter-spacing: .1em; }
.task { border-radius: 14px; margin: 0 0 20px; }
.task-label { border-radius: 999px; padding: 1px 12px; }
.q { border-radius: 14px; }
.q-text { font-size: clamp(.98rem, 1.6vw, 1.08rem); font-weight: 600; }
.points li::before, .insights li::before { width: 6px; height: 6px; top: .8em; border-radius: 50%; background: var(--muted); }

/* 数字のタイル：大きな数字だけ。国は小さな点で */
.stat-tiles { gap: 14px; }
.stat-tile { border: 1px solid var(--line); padding: 20px 20px 16px; gap: 4px; background: var(--surface); }
.stat-tile b { font-size: 2.6rem; line-height: 1; font-weight: 700; letter-spacing: -.01em; }
.stat-tile span { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.stat-tile[data-c] span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.stat-tile[data-c="JP"] span::before { background: var(--c-jp); }
.stat-tile[data-c="CN"] span::before { background: var(--c-cn); }
.stat-tile[data-c="KR"] span::before { background: var(--c-kr); }

/* 開催地マップ */
.ep-map-wrap { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(240px, 1fr); gap: 36px; align-items: center; margin-bottom: 40px; }
.ep-map { position: relative; aspect-ratio: 1000 / 825; }
.ep-map-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--sea); border: 1px solid var(--line); border-radius: 18px; --map-land-fill: var(--land); --map-land-stroke: var(--coast); --map-grat: color-mix(in srgb, var(--coast) 22%, transparent); }
.ep-dots { position: absolute; inset: 0; }
.ep-dot { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; padding: 0; border: 0; background: transparent; border-radius: 50%; cursor: pointer; }
.ep-dot i { position: absolute; inset: 6px; border-radius: 50%; background: var(--ink-2); border: 2px solid var(--land); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent); transition: transform .12s, opacity .15s; }
.ep-dot[data-c="JP"] i { background: var(--c-jp); }
.ep-dot[data-c="CN"] i { background: var(--c-cn); }
.ep-dot[data-c="KR"] i { background: var(--c-kr); }
.ep-dot.now i { inset: 3px; border-width: 2.5px; }
.ep-dot:hover, .ep-dot:focus-visible { z-index: 4; }
.ep-dot:hover i, .ep-dot:focus-visible i { transform: scale(1.45); }
.ep-dot.dim { opacity: .25; }
.ep-tip { display: none; position: absolute; left: 50%; bottom: calc(100% + 5px); transform: translateX(-50%); width: max-content; max-width: 15em; text-align: left; white-space: normal; z-index: 5; background: var(--ink); color: var(--bg); font-size: 12.5px; font-weight: 600; line-height: 1.4; padding: 5px 10px; border-radius: 8px; pointer-events: none; }
.ep-dot:hover .ep-tip, .ep-dot:focus-visible .ep-tip { display: block; }
.ep-dot.tip-r .ep-tip { left: auto; right: -6px; transform: none; }

function parseDriveUrl(raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return null;
  let u;
  try { u = new URL(s); } catch (e) { return { valid: false, raw: s }; }
  if (u.protocol !== "https:" && u.protocol !== "http:") return { valid: false, raw: s };
  const host = u.hostname.toLowerCase();
  const isGoogle = host === "drive.google.com" || host === "docs.google.com" || host === "drive.usercontent.google.com";
  if (!isGoogle) return { valid: false, raw: s, notDrive: true };
  const p = u.pathname;
  let id = null, kind = "file", m;
  if ((m = p.match(/\/folders\/([\w-]{10,})/))) { id = m[1]; kind = "folder"; }
  else if ((m = p.match(/\/(document|spreadsheets|presentation|forms)\/(?:u\/\d+\/)?d\/([\w-]{10,})/))) {
    id = m[2]; kind = { document: "doc", spreadsheets: "sheet", presentation: "slide", forms: "form" }[m[1]];
  }
  else if ((m = p.match(/\/file\/(?:u\/\d+\/)?d\/([\w-]{10,})/))) { id = m[1]; kind = "file"; }
  else {
    const q = u.searchParams.get("id");

  }
  if (!id) return { valid: false, raw: s, isDrive: true };
  const out = { valid: true, isDrive: true, id, kind, raw: s, openUrl: "", previewUrl: "", thumbUrl: "", embedUrl: "" };
  const thumb = "https://drive.google.com/thumbnail?id=" + id + "&sz=w640";
  u.protocol = "https:";
  if (kind === "folder") {
    out.openUrl = "https://drive.google.com/drive/folders/" + id;
    out.embedUrl = "https://drive.google.com/embeddedfolderview?id=" + id + "#grid";
    out.previewUrl = out.embedUrl;
  } else if (kind === "doc") {
    out.openUrl = u.href; out.previewUrl = "https://docs.google.com/document/d/" + id + "/preview"; out.thumbUrl = thumb;
  } else if (kind === "sheet") {
    out.openUrl = u.href; out.previewUrl = "https://docs.google.com/spreadsheets/d/" + id + "/preview"; out.thumbUrl = thumb;
  } else if (kind === "slide") {
    out.openUrl = u.href; out.previewUrl = "https://docs.google.com/presentation/d/" + id + "/embed"; out.thumbUrl = thumb;
  } else if (kind === "form") {
    out.openUrl = u.href;

    out.openUrl = "https://drive.google.com/file/d/" + id + "/view";
    out.previewUrl = "https://drive.google.com/file/d/" + id + "/preview";
    out.thumbUrl = thumb;
  }

}

async function fetchJson(url, opt, ms) {

    const tm = setTimeout(() => { done(); reject(new Error("timeout")); }, ms || 12000);

async function postToEndpoints(eps, action, data) {

  state.archives = SAMPLE.archives.concat(state.localAdds.archives).filter((a) => hidden.indexOf(a.id) < 0).map(normArchive);
  state.apiEpisodes = [];
  state.snapAt = "";
  mergePending();
}
async function loadData() {
  const seq = ++state.loadSeq;
  state.localAdds = localLoad();
  state.outbox = outboxLoad();
  const eps = endpoints(), snapU = snapshotUrl();
  const cache = (eps.length || snapU) ? cacheLoad() : null;
  if (cache) { applyData(cache, "snapshot", cache.at); renderAll(); }       // まず前回の内容を表示する
  let liveDone = false;
  const snapP = snapU ? fetchSnapshot().catch(() => null) : Promise.resolve(null);
  snapP.then((d) => {                                                          // 複製が先に届けば、ライブを待たずに表示する
    if (d && !liveDone && seq === state.loadSeq) { applyData(d, "snapshot", d.generatedAt || d.serverTime); cacheSave(d); renderAll(); }
  });
  const live = eps.length ? await tryLive(eps) : null;
  liveDone = true;
  if (seq !== state.loadSeq) return;
  if (live) { applyData(live, "api"); cacheSave(live); }
  else {
    const snap = await snapP;
    if (seq !== state.loadSeq) return;
    if (snap) { applyData(snap, "snapshot", snap.generatedAt || snap.serverTime); cacheSave(snap); }
    else if (cache) { applyData(cache, "snapshot", cache.at); }
    else {
      console.warn("[EAEE] API load failed:", state.liveErr);
      state.mode = eps.length ? "error" : "local"; state.err = eps.length ? state.liveErr : "";
      useLocal();
    }
  }
  renderAll();
  if (live && state.outbox.length) flushOutbox();
}
function mergedEpisodes() {
  const byNo = {};
  state.apiEpisodes.forEach((e) => { if (e.episodeNumber) byNo[e.episodeNumber] = e; });
  return EPISODES_BASE.map((b) => {
    const o = byNo[b.episodeNumber];
    const out = Object.assign({}, b);
    if (o) ["year", "location", "country", "theme", "driveUrl", "note", "altUrl"].forEach((k) => { if (o[k] !== "" && o[k] != null) out[k] = o[k]; });
    if (o && o.year !== "" && o.year != null && String(o.year) !== String(b.year)) out.yearLabel = "";
    return out;
  });
}
/* 投稿：接続先があれば必ずAPIへ。届かなければ「送信待ち」。接続先が未設定のときだけ、このブラウザに保存（パイロット） */
async function submitRecord(action, key, record) {
  const eps = endpoints();
  if (eps.length) {
    const rec = Object.assign({ id: newClientId() }, record);
    try {
      const r = await postToEndpoints(eps, action, rec);
      await loadData();
      return r;
    } catch (e) {
      if (!(e && e.net)) throw e;
      enqueue(action, rec, e.message);
      state.logs = state.logs.filter((x) => !x.pending); state.comments = state.comments.filter((x) => !x.pending); state.archives = state.archives.filter((x) => !x.pending);
      mergePending();
      renderAll();
      return { ok: true, queued: true, record: rec };
    }
  }
  const rec = Object.assign({ id: "local-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), timestamp: new Date().toISOString() }, record);
  state.localAdds[key].push(rec);
  localSave();
  useLocal();
  renderAll();
  return { ok: true, local: true, record: rec };
}

const TABS = ["welcome", "history", "noto", "archive", "members"];
function showTab(name) {
  if (TABS.indexOf(name) < 0) name = "welcome";
  state.tab = name;
  $$(".tabpanel").forEach((p) => { p.hidden = p.dataset.tab !== name; });
  $$(".tabs a").forEach((a) => {
    const on = a.dataset.tab === name;
    a.setAttribute("aria-selected", String(on));
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
/** #welcome などタブ名、または各セクションのid（#logs・#survey など）に移動する。セクションなら、そのタブを開いてからスクロールする */
const OLD_IDS = { meeting: "noto-after" }; // 以前の見出しへのリンクを、いまの場所へ
function routeTo(hash, fromHistory) {
  let id = String(hash || "").replace(/^#/, "");
  if (OLD_IDS[id]) id = OLD_IDS[id];
  if (!id) { showTab("welcome"); window.scrollTo(0, 0); return; }
  let tab = TABS.indexOf(id) >= 0 ? id : "";
  const target = tab ? null : document.getElementById(id);
  if (!tab) {
    const panel = target && target.closest(".tabpanel");
    if (!panel) { if (target) scrollToId(id); return; }
    tab = panel.dataset.tab;
  }
  const changed = state.tab !== tab;
  showTab(tab);
  if (!fromHistory) { try { history[changed ? "pushState" : "replaceState"](null, "", "#" + id); } catch (e) { /* 埋め込み表示などでは履歴を使わない */ } }
  if (target) scrollToId(id); else window.scrollTo(0, 0);
}

/* ---------- 地図（海岸線だけ。国境線と海の名称は描かない） ---------- */
function epDots() {
  const placed = [];
  mergedEpisodes().filter((e) => e.geo).sort((a, b) => a.episodeNumber - b.episodeNumber).forEach((ep) => {
    const p = mapXY(ep.geo[0], ep.geo[1]);
    const d = { ep: ep, x: p[0], y: p[1] };
    const near = placed.filter((q) => Math.hypot(q.x - d.x, q.y - d.y) < 16).length;
    if (near) { const a = near * 2.1, r = 15 * Math.ceil(near / 2); d.x += Math.cos(a) * r; d.y += Math.sin(a) * r; } // 近い点は少しずらして重ならないように
    placed.push(d);
  });
  return placed;
}

/** 到達確認（応答の中身は見ない。つながるかどうかだけ） */
function probeUrl(url, ms) {
  return new Promise((resolve) => {
    const ctl = new AbortController();
    const tm = setTimeout(() => { ctl.abort(); resolve(false); }, ms || 3000);
    fetch(url, { mode: "no-cors", cache: "no-store", signal: ctl.signal }).then(() => { clearTimeout(tm); resolve(true); }).catch(() => { clearTimeout(tm); resolve(false); });
  });
}
/** Googleのフォント・ドライブに届くか（届かなければ、Webフォントを読まず、画像の取得も試みない） */
function googleProbe() {
  if (!googleProbe.p) {
    googleProbe.p = probeUrl("https://fonts.googleapis.com/robots.txt?t=" + Math.floor(Date.now() / 60000), 4000).then((ok) => {
      const was = state.google;
      state.google = ok;
      if (was === undefined && !ok) renderAll();
      return ok;
    });
  }
  return googleProbe.p;
}
const fmtDateTime = (iso) => {
  const d = new Date(iso);
  return isNaN(d.getTime()) ? "" : d.toLocaleString(LANG_LOCALE[state.lang], { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
};

}
async function runReach() {
  const out = $("#reachOut"), adv = $("#reachAdvice"), btn = $("#reachBtn");
  const R = t("settings.reachRows");
  const gasU = $("#setGas").value.trim() || gasUrl(), relU = $("#setRelay").value.trim() || relayUrl(), snapU = snapshotUrl();
  btn.disabled = true; btn.textContent = t("settings.reachRunning"); adv.hidden = true;
  const jobs = [
    ["snapshot", snapU ? () => fetchSnapshot() : null],
    ["gas", gasU && isGasUrlShape(gasU) ? () => apiGet(gasU, "all", 8000) : null],
    ["relay", relU && isHttps(relU) ? () => apiGet(relU, "all", 8000) : null],
    ["google", () => probeUrl("https://www.google.com/favicon.ico?t=" + Date.now(), 4000).then((ok) => { if (!ok) throw new Error("x"); return ok; })]
  ];
  out.innerHTML = jobs.map((j) => '<li data-k="' + j[0] + '"><b>' + esc(R[j[0]]) + '</b><span class="rs" data-r="wait">…</span></li>').join("");
  const res = {};
  await Promise.all(jobs.map(async (j) => {
    const li = out.querySelector('[data-k="' + j[0] + '"] .rs');
    if (!j[1]) { res[j[0]] = "na"; li.dataset.r = "na"; li.textContent = t("settings.reachNa"); return; }
    const t0 = performance.now();
    try {
      const d = await j[1]();
      if (j[0] === "gas" || j[0] === "relay") { if (!d || d.ok === false || !Array.isArray(d.logs)) throw new Error("bad"); }
      res[j[0]] = "ok"; li.dataset.r = "ok"; li.textContent = "✓ " + t("settings.reachOk") + "（" + Math.round(performance.now() - t0) + "ms）";
    } catch (e) { res[j[0]] = "ng"; li.dataset.r = "ng"; li.textContent = "✕ " + t("settings.reachNg"); }
  }));
  const A = t("settings.reachAdvice");
  const reachable = ["snapshot", "gas", "relay"].some((k) => res[k] === "ok");
  const configured = ["snapshot", "gas", "relay"].some((k) => res[k] !== "na");
  let m = A.all;
  if (!reachable && configured) m = A.none;
  else if (res.google === "ng" || ["snapshot", "gas", "relay"].some((k) => res[k] === "ng")) m = A.noGoogle;
  adv.hidden = false; adv.textContent = m;
  btn.disabled = false; btn.textContent = t("settings.reachRun");
}

  const vol = state.formMode === "volunteer";
  const rec = {
    country: $("#lfCountry").value, role: $("#lfRole").value.trim(), author: $("#lfAuthor").value.trim(), cardType: vol ? VOLUNTEER_TYPE : $("#lfType").value,
    lenses: vol ? "" : $$("#lfLenses input:checked").map((i) => i.value).join(","), title: $("#lfTitle").value.trim(), content: $("#lfContent").value.trim(),
    driveUrl: $("#lfDrive").value.trim(), episodeYear: vol ? "" : $("#lfYear").value, altUrl: $("#lfAlt").value.trim(), activityDate: vol ? $("#lfDate").value : ""
  };
  if (!rec.author || !rec.title || !rec.content || (vol && !rec.activityDate)) { setMsg(msg, "ng", t("ui.needRequired")); return; }
  if (rec.activityDate && !/^\d{4}-\d{2}-\d{2}$/.test(rec.activityDate)) { setMsg(msg, "ng", t("ui.needRequired")); return; }
  if (!checkLen(rec.author, LIMITS.author) || !checkLen(rec.role, LIMITS.role) || !checkLen(rec.title, LIMITS.title) || !checkLen(rec.content, LIMITS.content)) { setMsg(msg, "ng", t("ui.tooLong")); return; }
  if (rec.driveUrl) { const d = parseDriveUrl(rec.driveUrl); if (!isDriveOk(d)) { setMsg(msg, "ng", t("form.driveNotDrive")); return; } }
  if (rec.altUrl && (!isHttps(rec.altUrl) || !checkLen(rec.altUrl, LIMITS.altUrl))) { setMsg(msg, "ng", t("form.altUrlBad")); return; }
  $("#lfSend").disabled = true; setMsg(msg, "", ""); msg.hidden = false; msg.textContent = t("ui.sending");
  try {
    const r = await submitRecord("addLog", "logs", rec);
    saveMe({ country: rec.country, author: rec.author, role: rec.role });
    if (!vol) state.filters = { country: "", lens: "", type: "", q: "" };
    closeModals(); renderLogs(); renderNotoAfter();
    toast(sentToast(r), r.queued ? 6000 : 0);
  } catch (e) {
    $("#lfSend").disabled = false;
    setMsg(msg, "ng", t("ui.failed") + String((e && e.message) || e));
  }
}
/** 投稿の下のコメント欄から送る */
async function onCommentSubmit(form) {
  const msg = $(".msg", form), btn = form.querySelector("button[type=submit]");
  if (form.elements.website.value) return;
  const logId = form.dataset.log;
  const rec = { logId: logId, country: form.elements.country.value, author: form.elements.author.value.trim(), relationType: form.elements.kind.value, text: form.elements.text.value.trim() };
  if (!rec.author || !rec.text) { setMsg(msg, "ng", t("ui.needRequired")); return; }
  if (!checkLen(rec.author, LIMITS.author) || !checkLen(rec.text, LIMITS.text)) { setMsg(msg, "ng", t("ui.tooLong")); return; }
  btn.disabled = true; setMsg(msg, "", ""); msg.hidden = false; msg.textContent = t("ui.sending");
  try {
    const r = await submitRecord("addComment", "comments", rec);
    const me = getMe(); saveMe(Object.assign(me, { country: rec.country, author: rec.author }));
    delete state.drafts[logId];
    state.openThreads.add(logId);
    renderLogs(); renderNotoAfter();
    toast(sentToast(r), r.queued ? 6000 : 0);
  } catch (e) {
    const f = document.querySelector('.c-form[data-log="' + CSS.escape(logId) + '"]') || form;
    f.querySelector("button[type=submit]").disabled = false;
    setMsg($(".msg", f), "ng", t("ui.failed") + String((e && e.message) || e));
  }
}
async function onArchiveSubmit(ev) {
  ev.preventDefault();
  if ($("#afHp").value) return;
  const msg = $("#afMsg");
  const rec = { episodeNumber: $("#afEp").value, year: $("#afYear").value, location: $("#afLoc").value.trim(), category: $("#afCat").value, title: $("#afTitle").value.trim(), driveUrl: $("#afDrive").value.trim(), language: $("#afLang").value, altUrl: $("#afAlt").value.trim() };
  if (rec.episodeNumber === "" || !rec.title) { setMsg(msg, "ng", t("ui.needRequired")); return; }
  if (!checkLen(rec.title, LIMITS.title) || !checkLen(rec.location, LIMITS.location)) { setMsg(msg, "ng", t("ui.tooLong")); return; }
  if (rec.driveUrl) { const d = parseDriveUrl(rec.driveUrl); if (!isDriveOk(d)) { setMsg(msg, "ng", t("form.driveNotDrive")); return; } }
  if (rec.altUrl && (!isHttps(rec.altUrl) || !checkLen(rec.altUrl, LIMITS.altUrl))) { setMsg(msg, "ng", t("form.altUrlBad")); return; }
  $("#afSend").disabled = true; setMsg(msg, "", ""); msg.hidden = false; msg.textContent = t("ui.sending");
  try {
    const r = await submitRecord("addArchive", "archives", rec);
    state.aFilters = { episode: "", category: "" };
    closeModals(); renderArchive(); renderTimeline();
    toast(sentToast(r), r.queued ? 6000 : 0);
  } catch (e) {
    $("#afSend").disabled = false;
    setMsg(msg, "ng", t("ui.failed") + String((e && e.message) || e));
  }
}

/* =====================================================================
   言語・初期化・イベント
   ===================================================================== */
function loadFont(lang) {
  const id = "font-" + lang;
  if (document.getElementById(id)) return;
  /* Googleフォントに届くときだけ読み込む。届かない地域では端末の標準フォントで表示する（読み込み待ちで画面が止まらない） */
  googleProbe().then((ok) => {
    if (!ok || document.getElementById(id) || state.lang !== lang) return;
    const l = document.createElement("link");
    l.id = id; l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?" + FONT_QS[lang] + "&display=swap";
    document.head.appendChild(l);
  });
}
function applyLang(lang, persist) {
  state.lang = lang;
  document.documentElement.lang = LANG_HTML[lang];
  loadFont(lang);
  if (persist) lsSet(LS_KEYS.lang, lang);
  $$(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $$("[data-i18n]").forEach((el) => { const v = t(el.dataset.i18n); if (typeof v === "string") el.textContent = v; });
  $$("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.title = t("meta.title");
  fillFormSelects();
  renderAll();
  if (!$("#m-settings").hidden) { $("#setGuide").innerHTML = t("settings.guide").map((s) => "<li>" + esc(s) + "</li>").join(""); $("#setState").textContent = statusLine(); }
  if (!$("#m-bridge").hidden) renderBridge();
}
function scrollToId(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}
function showTip(target, ev) {
  const tip = $("#tip");
  tip.textContent = target.dataset.tip;
  tip.classList.add("on");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x, y;
  if (ev && ev.clientX != null && ev.type !== "focusin") { x = ev.clientX + 14; y = ev.clientY - h - 12; }
  else { const r = target.getBoundingClientRect(); x = r.left + Math.min(r.width, 160); y = r.top - h - 8; }
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  if (y < 8) y = (ev && ev.clientY != null ? ev.clientY : 0) + 18;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => $("#tip").classList.remove("on");

function bindEvents() {
  document.addEventListener("click", (ev) => {
    const a = ev.target.closest("a[href^='#']");
    if (a && a.getAttribute("href").length > 1) { ev.preventDefault(); closeModals(); routeTo(a.getAttribute("href")); return; }
    if (ev.target.classList && ev.target.classList.contains("overlay")) { closeModals(); return; }
    const b = ev.target.closest("[data-action]");
    if (!b) return;
    const act = b.dataset.action;
    if (act === "open-settings") openSettings();
    else if (act === "close-modal") closeModals();
    else if (act === "new-log") openLogForm({ cardType: b.dataset.type || "" });
    else if (act === "new-volunteer") openLogForm({ cardType: VOLUNTEER_TYPE });
    else if (act === "card-post") {
      const q = NOTO_CARDS.questions.find((x) => x.c + "-" + x.g + x.n === b.dataset.id);
      if (q) openLogForm({ title: q.q, cardType: "共同探究のヒント", content: "（能登2026 探究カード " + en("country", q.c) + " " + q.g + q.n + "）\n" });
    }
    else if (act === "card-view") { state.cardView = b.dataset.v; renderCards(); }
    else if (act === "tour-day") { state.tourDay = b.dataset.d; renderNoto(); }
    else if (act === "del-archive") { const fromEp = !$("#m-episode").hidden; if (fromEp) closeModals(); openDelete(b.dataset.id); }
    else if (act === "set-type") { state.filters.type = b.dataset.type; renderLogs(); }
    else if (act === "show-type") { state.filters.type = b.dataset.type; renderLogs(); routeTo("#logs"); }
    else if (act === "toggle-thread" || act === "toggle-more") {
      const set = act === "toggle-thread" ? state.openThreads : state.expanded, id = b.dataset.id;
      if (set.has(id)) set.delete(id); else set.add(id);
      renderLogs(); renderNotoAfter();
    }
    else if (act === "new-archive") openArchiveForm({});
    else if (act === "add-record") {
      const n = Number(b.dataset.n);
      const ep = mergedEpisodes().find((e) => e.episodeNumber === n) || {};
      closeModals();
      openArchiveForm({ episodeNumber: n, year: ep.year, location: ep.location });
    }
    else if (act === "open-episode") openEpisode(Number(b.dataset.n));
    else if (act === "show-photos") { state.pEpisode = String(b.dataset.n); renderPhotos(); routeTo("#photos"); }
    else if (act === "add-photo") {
      const n = state.pEpisode === "" ? "" : Number(state.pEpisode);
      const ep = n === "" ? {} : (mergedEpisodes().find((e) => e.episodeNumber === n) || {});
      openArchiveForm({ episodeNumber: n, year: ep.year, location: ep.location, category: "写真" });
    }
    else if (act === "add-doc") {
      const ep = mergedEpisodes().find((e) => e.episodeNumber === NOTO_EP) || {};
      openArchiveForm({ episodeNumber: NOTO_EP, year: ep.year || 2026, location: "能登", category: b.dataset.cat });
    }
    else if (act === "preview") openPreview(b.dataset.url, b.dataset.title);
    else if (act === "toggle-embed") { state.embed = !state.embed; renderArchive(); }
    else if (act === "toggle-table") {
      const card = b.closest(".chart-card");
      const tbl = $(".chart-table", card), view = $(".chart-view", card);
      const showTable = tbl.hidden;
      tbl.hidden = !showTable; view.hidden = showTable;
      b.textContent = showTable ? t("survey.viewChart") : t("survey.viewTable");
    }
    else if (act === "test-settings") testConnection();
    else if (act === "reach-run") runReach();
    else if (act === "open-bridge") openBridge();
    else if (act === "bridge-resend") bridgeResend();
    else if (act === "bridge-export") bridgeExport();
    else if (act === "bridge-remove") bridgeRemove(b.dataset.id, b);
    else if (act === "bridge-check") bridgeCheck();
    else if (act === "bridge-import") bridgeImport();
    else if (act === "reset-settings") {
      lsDel(LS_KEYS.gas); lsDel(LS_KEYS.relay); lsDel(LS_KEYS.pass); lsDel(LS_KEYS.ep);
      $("#setGas").value = isPlaceholder(GAS_WEB_APP_URL) ? "" : GAS_WEB_APP_URL; $("#setPass").value = "";
      $("#setRelay").value = isPlaceholder(RELAY_URL) ? "" : RELAY_URL;
      setMsg($("#setMsg"), "ok", t("settings.resetDone"));
      loadData().then(() => { $("#setState").textContent = statusLine(); });
    }
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && $$(".overlay").some((m) => !m.hidden)) closeModals(); });
  $$(".langs button").forEach((b) => b.addEventListener("click", () => applyLang(b.dataset.lang, true)));
  $("#fCountry").addEventListener("change", (e) => { state.filters.country = e.target.value; renderLogs(); });
  $("#fLens").addEventListener("change", (e) => { state.filters.lens = e.target.value; renderLogs(); });
  $("#fSearch").addEventListener("input", (e) => { state.filters.q = e.target.value; renderLogs(); });
  $("#lfType").addEventListener("change", updateTypeHelp);
  document.addEventListener("submit", (ev) => { const f = ev.target; if (f.classList && f.classList.contains("c-form")) { ev.preventDefault(); onCommentSubmit(f); } });
  const keepDraft = (ev) => {
    const f = ev.target.closest && ev.target.closest(".c-form");
    if (!f || !ev.target.name || ev.target.name === "website") return;
    const d = state.drafts[f.dataset.log] || (state.drafts[f.dataset.log] = {});
    d[ev.target.name] = ev.target.value;
  };
  document.addEventListener("input", keepDraft); document.addEventListener("change", keepDraft);
  $("#aEpisode").addEventListener("change", (e) => { state.aFilters.episode = e.target.value; renderArchive(); });
  $("#tlCountry").addEventListener("change", (e) => { state.tlCountry = e.target.value; renderTimeline(); });
  $("#pEpisode").addEventListener("change", (e) => { state.pEpisode = e.target.value; renderPhotos(); });
  window.addEventListener("popstate", () => routeTo(location.hash, true));
  $("#aCategory").addEventListener("change", (e) => { state.aFilters.category = e.target.value; renderArchive(); });
  $("#logForm").addEventListener("submit", onLogSubmit);
  $("#archForm").addEventListener("submit", onArchiveSubmit);
  $("#delForm").addEventListener("submit", onDeleteSubmit);
  $("#cardCountry").addEventListener("change", (e) => { state.cardCountry = e.target.value; renderCards(); });
  $("#cardTheme").addEventListener("change", (e) => { state.cardTheme = e.target.value; renderCards(); });
  $("#setForm").addEventListener("submit", (e) => { e.preventDefault(); saveSettings(); });
  $("#lfDrive").addEventListener("input", (e) => drivePreviewInto($("#lfDrivePrev"), e.target.value));
  $("#afDrive").addEventListener("input", (e) => drivePreviewInto($("#afDrivePrev"), e.target.value));
  $("#brImportIn").addEventListener("input", () => { $("#brImportBtn").disabled = true; });
  window.addEventListener("online", () => { loadData(); });
  setInterval(() => { if (state.outbox.length && !document.hidden && !state.flushing) flushOutbox(); }, 60000);
  $("#driveTestIn").addEventListener("input", (e) => {
    const d = parseDriveUrl(e.target.value), out = $("#driveTestOut");
    if (!d) { out.textContent = ""; return; }
    out.textContent = d.valid ? t("settings.detected", { kind: t("settings.kind." + d.kind), id: d.id }) : t("form.driveNotDrive");
  });
  /* グラフのツールチップ */
  document.addEventListener("mouseover", (ev) => { const b = ev.target.closest && ev.target.closest(".bar[data-tip]"); if (b) showTip(b, ev); });
  document.addEventListener("mousemove", (ev) => { const b = ev.target.closest && ev.target.closest(".bar[data-tip]"); if (b) showTip(b, ev); });
  document.addEventListener("mouseout", (ev) => { if (ev.target.closest && ev.target.closest(".bar[data-tip]")) hideTip(); });
  document.addEventListener("focusin", (ev) => { const b = ev.target.closest && ev.target.closest(".bar[data-tip]"); if (b) showTip(b, ev); });
  document.addEventListener("focusout", (ev) => { if (ev.target.closest && ev.target.closest(".bar[data-tip]")) hideTip(); });
}

function init() {
  state.localAdds = localLoad();
  useLocal();
  const saved = lsGet(LS_KEYS.lang);
  const nav = String(navigator.language || "ja").toLowerCase();
  const lang = saved && I18N[saved] ? saved : (nav.indexOf("zh") === 0 ? "zh" : nav.indexOf("ko") === 0 ? "ko" : nav.indexOf("en") === 0 ? "en" : "ja");
  bindEvents();
  $("#notoForum").href = OFFICIAL.forum; $("#memberOfficial").href = OFFICIAL.members; $("#historyOfficial").href = OFFICIAL.history; $("#footOfficial").href = OFFICIAL.home;
  applyLang(lang, false);
  routeTo(location.hash, true);
  loadData();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();

</script>
